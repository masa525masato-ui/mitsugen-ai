<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蜜源植物サーチ</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
<h1>蜜源植物サーチ</h1>
<p class="sub">植物を撮影すると、名前と蜜源植物かどうかを判定します。</p>

<div class="btns" style="margin-top:14px">
  <label class="btn p">撮影<input id="cam" type="file" accept="image/*" capture="environment"></label>
  <label class="btn">画像を選ぶ<input id="pick" type="file" accept="image/*"></label>
</div>
<img id="prev" alt="選択した写真">
<button id="go" class="btn p">この写真を判定する</button>
<div id="out"></div>
<p class="note">植物名はAIの画像認識(またはPl@ntNet)による推定で、蜜源判定は内蔵リストとの照合を優先します。誤判定の可能性があるため、毒性の判断や採取・食用には使わないでください。</p>
</main>

<script src="script.js"></script>
</body>
</html>
